<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 48" fill="none">
  <rect width="120" height="48" rx="10" fill="#0068B5"/>
  <!-- Dot over the i (signature Intel cyan-white square/dot) -->
